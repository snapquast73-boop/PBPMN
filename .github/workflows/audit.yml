name: Verify MLB schedule sources
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python tools/audit.py
      - name: Attach compressed verified HTML to check for API review
        run: echo "::notice title=Verified schedule audit::$(gzip -cn docs/audit.html | base64 -w0)"
      - uses: actions/upload-artifact@v6
        with:
          name: schedule-audit
          path: docs/audit.html
